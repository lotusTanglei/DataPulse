services:
  datapulse:
    build: .
    environment:
      DATAPULSE_MASTER_KEY: ${DATAPULSE_MASTER_KEY:?Generate DATAPULSE_MASTER_KEY before starting DataPulse}
      DATAPULSE_SIGNING_KEY: ${DATAPULSE_SIGNING_KEY:?Generate DATAPULSE_SIGNING_KEY before starting DataPulse}
      DATAPULSE_FORWARDED_ALLOW_IPS: ${DATAPULSE_FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "8000:8000"
    volumes:
      - datapulse-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  datapulse-data:
