[tool.uv.workspace]
members = ["apps/server"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps/server/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["apps/server/tests"]
pythonpath = ["apps/server"]
markers = [
    "integration: requires external database services",
]
