name: datapulse-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datapulse
      POSTGRES_USER: datapulse
      POSTGRES_PASSWORD: datapulse
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapulse -d datapulse"]
      interval: 2s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: datapulse
      MARIADB_USER: datapulse
      MARIADB_PASSWORD: datapulse
      MARIADB_ROOT_PASSWORD: datapulse-root
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
