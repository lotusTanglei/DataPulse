name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    name: Foundation
    runs-on: ubuntu-latest
    env:
      DATAPULSE_TEST_POSTGRES_URL: postgresql+asyncpg://datapulse:datapulse@127.0.0.1:55432/datapulse
      DATAPULSE_TEST_MYSQL_URL: mysql+asyncmy://datapulse:datapulse@127.0.0.1:53306/datapulse
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: datapulse
          POSTGRES_USER: datapulse
          POSTGRES_PASSWORD: datapulse
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U datapulse -d datapulse"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: datapulse
          MARIADB_USER: datapulse
          MARIADB_PASSWORD: datapulse
          MARIADB_ROOT_PASSWORD: datapulse-root
        ports:
          - 53306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-packages --group dev --frozen

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify contracts, backend, and Web
        run: pnpm verify

      - name: Check Python style
        run: |
          uv run --package datapulse-server ruff check apps/server tools
          uv run --package datapulse-server ruff format --check apps/server tools

      - name: Build container
        run: docker build -t datapulse:test .

  python-314:
    name: Python 3.14 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --group dev --frozen

      - name: Test backend and contract export
        run: |
          uv run --package datapulse-server pytest apps/server/tests
          uv run --package datapulse-server python tools/export_schemas.py
          git diff --exit-code -- packages/schema/schemas
